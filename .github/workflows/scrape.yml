name: AI events scrape

on:
  schedule:
    # 02:00 UTC every 3rd day of the month. The scrape doubles as the keep-alive
    # for Supabase free tier, which pauses a project after ~7 days idle.
    # Weekly was NOT enough: GitHub delays scheduled runs (24 Aug fired 02:56,
    # 31 Aug fired 07:56), so 7 days + delay crossed the window, the project
    # paused, and every run from 31 Aug to 12 Oct failed on DNS. Every 3 days
    # leaves 4+ days of headroom for scheduler delay. (The */3 day-of-month
    # step resets at month end, so gaps are 1-3 days, never longer.)
    - cron: "0 2 */3 * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Per-source queries — each source has its own; never share one value.
          LUMA_CATEGORY_SLUG: ${{ secrets.LUMA_CATEGORY_SLUG }}
          # A plain variable, not a secret — a search term is not sensitive.
          # Note it STILL prints as *** today: GitHub masks every occurrence of
          # any secret's value, and LUMA_CATEGORY_SLUG (a secret) is also "ai".
          # Making the Luma slug a variable too is what would restore readable
          # logs. The `|| 'ai'` matters: an unset repo variable expands to an
          # empty string, and os.getenv treats "" as set, so Meetup would
          # search for nothing.
          MEETUP_KEYWORDS: ${{ vars.MEETUP_KEYWORDS || 'ai' }}
        run: python run.py
