name: Weekly AI events scrape

on:
  schedule:
    # 02:00 UTC every Monday. Weekly (not fortnightly) so the cadence stays
    # inside Supabase free-tier's ~7-day inactivity window — the scrape doubles
    # as the keep-alive that stops the project auto-pausing between runs.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LUMA_CATEGORY_SLUG: ${{ secrets.LUMA_CATEGORY_SLUG }}
        run: python run.py
