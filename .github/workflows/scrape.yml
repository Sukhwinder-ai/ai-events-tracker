name: Weekly AI events scrape

on:
  schedule:
    # 02:00 UTC every Monday. Weekly (not fortnightly) so the cadence stays
    # inside Supabase free-tier's ~7-day inactivity window — the scrape doubles
    # as the keep-alive that stops the project auto-pausing between runs.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Per-source queries — each source has its own; never share one value.
          LUMA_CATEGORY_SLUG: ${{ secrets.LUMA_CATEGORY_SLUG }}
          # Not a secret (it is just a search term), so it stays readable in
          # logs. The `|| 'ai'` matters: an unset repo variable expands to an
          # empty string, which would override the code default with "".
          MEETUP_KEYWORDS: ${{ vars.MEETUP_KEYWORDS || 'ai' }}
        run: python run.py
