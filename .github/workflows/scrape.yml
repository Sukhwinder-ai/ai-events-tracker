name: Weekly AI events scrape

on:
  schedule:
    # 02:00 UTC every Monday. Weekly (not fortnightly) so the cadence stays
    # inside Supabase free-tier's ~7-day inactivity window — the scrape doubles
    # as the keep-alive that stops the project auto-pausing between runs.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Per-source queries — each source has its own; never share one value.
          LUMA_CATEGORY_SLUG: ${{ secrets.LUMA_CATEGORY_SLUG }}
          # A plain variable, not a secret — a search term is not sensitive.
          # Note it STILL prints as *** today: GitHub masks every occurrence of
          # any secret's value, and LUMA_CATEGORY_SLUG (a secret) is also "ai".
          # Making the Luma slug a variable too is what would restore readable
          # logs. The `|| 'ai'` matters: an unset repo variable expands to an
          # empty string, and os.getenv treats "" as set, so Meetup would
          # search for nothing.
          MEETUP_KEYWORDS: ${{ vars.MEETUP_KEYWORDS || 'ai' }}
        run: python run.py
